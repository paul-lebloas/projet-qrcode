# Projet « Scan produit » — identification d'un produit par QR Code ou EAN-13.
#
# Isolation réseau (cf. cadrage §10) :
#   - front : ihm <-> orchestrateur         (seul réseau avec un port publié : 8080)
#   - back  : orchestrateur <-> ocr / dataaccess   (internal : pas d'accès extérieur)
#   - data  : dataaccess <-> redis / postgres      (internal : pas d'accès extérieur)
#
# Conséquences : l'orchestrateur ne voit ni Redis ni PostgreSQL ; l'OCR ne voit
# que l'orchestrateur ; seul Data Access parle à la base et au cache.

name: scan-produit

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

x-app-hardening: &app-hardening
  <<: *hardening
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp

services:
  # ---------------------------------------------------------------- Priorité 1
  redis:
    <<: *hardening
    image: redis:7-alpine
    # Cache pur : pas de persistance, mémoire bornée, éviction LRU, mot de passe.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD manquant - copier .env.example vers .env}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # ---------------------------------------------------------------- Priorité 2
  postgres:
    <<: *hardening
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-produits}
      POSTGRES_USER: ${POSTGRES_USER:-produits}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant - copier .env.example vers .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  dataaccess:
    <<: *app-hardening
    build: ./dataaccess
    environment:
      ASPNETCORE_URLS: http://+:8000
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-produits}
      POSTGRES_USER: ${POSTGRES_USER:-produits}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-600}
      CACHE_NEGATIVE_TTL_SECONDS: ${CACHE_NEGATIVE_TTL_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [back, data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------- Priorité 4
  ocr:
    <<: *app-hardening
    build: ./ocr
    networks: [back]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------- Priorité 3
  orchestrator:
    <<: *app-hardening
    build: ./orchestrator
    environment:
      DATAACCESS_URL: http://dataaccess:8000
      OCR_URL: http://ocr:8000
    depends_on:
      dataaccess:
        condition: service_healthy
      ocr:
        condition: service_healthy
    networks: [front, back]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------- Priorité 5
  ihm:
    <<: *app-hardening
    build: ./ihm
    ports:
      # Unique port publié de toute l'application (cadrage §10).
      - "8080:8080"
    depends_on:
      orchestrator:
        condition: service_healthy
    networks: [front]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  front: {}
  back:
    internal: true
  data:
    internal: true

volumes:
  pgdata: {}
