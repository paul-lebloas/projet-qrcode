# Point d'entrée unique de l'application : seul port publié = 8080 (cadrage §10).
# Sert l'IHM statique et relaie /api vers l'orchestrateur sur le réseau Docker interne.

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Une image de 5 Mo maximum, plus l'enveloppe multipart.
    client_max_body_size 6m;

    include /etc/nginx/snippets/security-headers.conf;

    # Santé du conteneur (non relayée à l'orchestrateur).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;

        # Résolution par le DNS interne de Docker, à chaque requête : survit à la recréation du conteneur.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $orchestrator http://orchestrator:8000;
        proxy_pass $orchestrator;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # En-têtes du client non reconduits : l'orchestrateur ne doit pas se fier à ce qu'ils annoncent.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
